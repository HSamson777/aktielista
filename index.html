const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function öppna(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(D.s),iterations:D.i,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const sida=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(D.n)},key,b(D.c)));
  document.open();document.write(sida);document.close();
}
function läs(){try{return localStorage.getItem(K)}catch(x){return null}}
function spara(v){try{v?localStorage.setItem(K,v):localStorage.removeItem(K)}catch(x){}}
document.getElementById("f").onsubmit=async ev=>{ev.preventDefault();const pw=document.getElementById("p").value;
  const kom=document.getElementById("kom").checked;
  try{await öppna(pw);spara(kom?pw:null)}
  catch(x){document.getElementById("fel").textContent="Fel lösenord."}};
const sparat=läs(); if(sparat){öppna(sparat).catch(()=>spara(null))}
